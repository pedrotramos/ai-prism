# AI Prism — Databricks Asset Bundle.
#
# One `databricks bundle deploy` provisions the ENTIRE stack for a fresh
# workspace, so an operator needs zero manual infra steps:
#
#   • Lakebase (serverless Postgres) — autoscaling 0.5–16 CU, auto-stops after
#     30 min idle. Stores chat sessions/messages, deck templates and pgvector RAG.
#   • Serverless SQL Warehouse — runs UC Function tools and the built-in Python UDF.
#   • The Databricks App itself — env wired from the resources above (no hand-edited
#     app.yaml): the deploying user becomes the bootstrap admin.
#   • Two AI/BI dashboards over system tables: AI costs per user, and the
#     operations dashboard (calls, active users, tokens, gateway latency).
#   • A post-deploy auto-config job — provisions the built-in Python UDF and prints
#     the resolved config (deployer email, warehouse id, Lakebase host/db).
#
# Everything is scoped per workspace: each customer deploys their own copy. The
# app runs the prebuilt artifacts (client/dist + server-dist), which feature
# branches do not commit: deploy.sh / deploy.ps1 run `npm run bundle` first (and
# `npm run smoke` after); a bare `databricks bundle deploy` needs it run by hand.
bundle:
  name: ai-prism

# Optional pieces an operator turns on by copying a `.example` file in
# bundle/optional/ to `.yml` (a glob with no match includes nothing). Today:
# the keyed web search fallback's secret (web-search-secret.yml.example,
# docs/web-search.md; the MCP web search paths need nothing in the bundle) and
# the admin audit hash key, APP_AUDIT_HASH_KEY in app.yaml
# (audit-hash-key-secret.yml.example; docs/security-threat-model.md G8).
include:
  - bundle/optional/*.yml

# What `bundle deploy` uploads to the workspace (and the App runs from). In a folder WITHOUT
# git (the customer ZIP) the sync does NOT apply .gitignore, so everything that is not code
# or a build artifact of the app has to be excluded here, or the first deploy tries to upload
# node_modules (hundreds of MB) and hangs. The patterns match one whole path component at ANY
# depth (`x/**` also matches a file named x), `/x` anchors at the root, `*` does not cross
# `/`, and `!x` re-admits what an EARLIER pattern excluded (the last match wins), so the
# order matters. They also hold in a git checkout, where .gitignore does not cover local
# copies of credentials. `.*` excludes EVERY hidden file or folder at any depth (.env*,
# .DS_Store, .git*, .idea, .venv, .cache, .claude, .npmrc.local, .npmignore, unicode names...);
# the two anchored negations then re-admit ONLY the root `.npmrc` and `.nvmrc` (the `.npmrc`
# carries `omit=dev`: the App must not install devDependencies). A negation would also
# re-admit a FOLDER with that name and everything in it, so `/.npmrc/*` and `/.nvmrc/*`
# (after the negations) drop the contents of such a folder and leave the regular file
# standing (`/.npmrc/**` would not do: it matches the file itself too); deploy.sh and
# deploy.ps1 also abort when .npmrc/.nvmrc exist and are not regular files. server-dist/ and
# client/dist/ are deliberately NOT listed: the App runs `node server-dist/index.cjs` and
# serves client/dist (no pattern here matches a path component named `dist`). `.git/` and
# `.databricks/` the CLI never uploads. Checked with a real `bundle sync --dry-run` in a
# folder without git and in a git checkout (tests/customerZip.test.mjs). A `bundle validate`
# on a clean tree prints "Pattern ... does not match any files" warnings for the patterns
# with no file: harmless (`bundle plan`, `summary` and `deploy` do not print them).
sync:
  exclude:
    - '.*'
    - '!/.npmrc'
    - '!/.nvmrc'
    - '/.npmrc/*'
    - '/.nvmrc/*'
    - ai-prism-manifest.txt
    - node_modules/**
    - __pycache__/**
    - '*.pyc'
    - coverage/**
    - scratch/**
    - logs/**
    - '*.log'
    - '*.zip'
    - '*.tar.gz'
    - '*.tgz'
    - Thumbs.db
    - desktop.ini

variables:
  tools_catalog:
    description: >-
      Catalog where the built-in Python UDF is provisioned. Defaults to the
      dedicated `ai_prism` catalog so all AI Prism assets (UDF + image volume)
      live in one place.
    default: ai_prism
  tools_schema:
    description: Schema where the built-in Python UDF is provisioned.
    default: default
  lakebase_database:
    description: Lakebase (Postgres) database name.
    default: databricks_postgres
  lakebase_suspend_timeout:
    description: >-
      Tempo sem uso até o Lakebase dormir (scale to zero), de 60s a 604800s;
      a primeira requisição depois disso leva alguns segundos a mais. Padrão
      600s (10 min); antes era 1800s. Uma aba visível do app mantém o banco
      acordado (GET /api/keepalive, a cada ~4 min), então só quem fica sem
      usar o app por esse tempo paga o acordar. O pool do app fecha conexões
      paradas após 2 min (PG_POOL_IDLE_TIMEOUT_MS), bem abaixo deste valor.
    default: 600s
  image_volume_catalog:
    description: >-
      Catalog for AI Prism's generated-image storage. Defaults to the dedicated
      `ai_prism` catalog (same as the tools catalog) so all AI Prism assets live
      in one place; the app owner can point it anywhere.
    default: ai_prism
  image_volume_schema:
    description: Schema (inside image_volume_catalog) for the images volume.
    default: default
  image_volume_name:
    description: UC Volume name that holds the generated-image bytes.
    default: ai_prism_images
  warehouse_serverless:
    description: >-
      true = SQL Warehouse serverless (padrão). false = Pro clássico, para
      workspaces sem serverless (deploy.sh/deploy.ps1 passam false quando
      CLASSIC_CLUSTER_ID está definido, e o instalador em notebook no modo
      "não" de serverless).
    default: true

  # --- Tags de recurso — ver docs/tags.md ---
  # Variável COMPLEXA (mapa): a CLI recusa `--var` com aspas no valor e recusa
  # `BUNDLE_VAR_resource_tags` de propósito ("setting via environment variables
  # is not supported for complex variable") — só aceita um arquivo de overrides.
  # Por isso deploy.sh/deploy.ps1/o notebook gravam
  # `.databricks/bundle/<target>/variable-overrides.json` em vez de passar
  # `--var`. `ai_prism_app` no default nunca é sobrescrito pelo operador — ver
  # server/resourceTags.js (mesma regra, para o runtime do app).
  #
  # O valor "ai-prism" abaixo (e em resource_tags_list/resource_tags_json) é um
  # literal intencional, igual ao `bundle.name` e ao nome do app em deploy.sh /
  # deploy.ps1. Um rename do app precisa trocar esses lugares junto.
  resource_tags:
    type: complex
    description: >-
      Tags do operador (chave→valor) aplicadas a todos os recursos criados
      por este bundle (job, além da tag embutida ai_prism_app). Para o SQL
      Warehouse e o Lakebase, que exigem uma LISTA [{key,value}], ver
      resource_tags_list — mantenha os dois em sincronia (deploy.sh/
      deploy.ps1/o notebook gravam ambos a partir do mesmo --tag/TAGS).
    default:
      ai_prism_app: ai-prism
  resource_tags_list:
    type: complex
    description: >-
      As mesmas tags de resource_tags, em [{key,value}] — o formato exigido
      por sql_warehouses.*.tags.custom_tags e postgres_projects.*.custom_tags.
    default:
      - key: ai_prism_app
        value: ai-prism
  resource_tags_json:
    description: >-
      As mesmas tags de resource_tags, serializadas em JSON de uma linha —
      repassadas ao job de auto-config via base_parameters (um parâmetro de
      notebook é sempre string; uma variável complexa não pode ir direto
      nele). Diferente de resource_tags, esta é uma variável SIMPLES: setável
      com `BUNDLE_VAR_resource_tags_json='{"k":"v"}'`. deploy.sh/deploy.ps1/o
      notebook exportam essa env antes de `bundle deploy`/`bundle run`.
    default: '{"ai_prism_app":"ai-prism"}'
  serverless_usage_policy_id:
    description: >-
      Id de uma serverless usage policy já existente (workspace: Settings →
      Compute → Serverless usage policies → Manage) para atribuir o consumo
      serverless do App e do job de auto-config às tags/orçamento daquela
      policy (billing: system.billing.usage.custom_tags, via
      usage_metadata.usage_policy_id). Vazio (padrão) = nenhuma policy
      atribuída. Este bundle NUNCA cria a policy — é um objeto de conta,
      compartilhado entre workspaces. Ver docs/tags.md.
    default: ''

  telemetry_catalog:
    description: >-
      Catalog of the schema that receives the app telemetry (otel_spans, otel_logs,
      otel_metrics; scripts/telemetry/enable.sh). Used by the telemetry alerts below.
      The dashboard file is generated for the same schema: python3 dashboards/build.py
      --catalog <catalog> --schema <schema> (docs/operations.md §3).
    default: ai_prism
  telemetry_schema:
    description: Schema (inside telemetry_catalog) that holds the telemetry tables.
    default: telemetry
  telemetry_alerts_pause:
    description: >-
      PAUSED (default) or UNPAUSED. The telemetry alerts are created paused because their
      queries read tables that exist only after telemetry is enabled; set UNPAUSED once
      `otel_spans` exists (docs/operations.md §5.2).
    default: PAUSED

resources:
  # --- Lakebase: serverless Postgres, autoscaling 0.5–16 CU, 30-min auto-stop ---
  # Lakebase has TWO product lines with different APIs:
  #   • "Autoscaling" (projects/branches/endpoints, /api/2.0/postgres/...) —
  #     the ONLY one with an autoscaling CU range + scale-to-zero. Cloud-agnostic.
  #   • "Provisioned" (database_instances) — fixed capacity SKU only, no autoscale.
  # We use Autoscaling so the compute range + auto-stop below are honored.
  #
  # Creating the project auto-provisions a default branch ("production") and a
  # read-write endpoint ("primary") with these default_endpoint_settings applied.
  # The endpoint host is not exposed on the project, so we declare the primary
  # endpoint explicitly and adopt the auto-created one via replace_existing, with
  # its parent = the branch path (NOT the project — that path 404s). We then read
  # the resolved read-write host from status.hosts.host.
  postgres_projects:
    ai_prism_pg:
      project_id: ai-prism
      display_name: ai-prism
      # Beta: encaminhado ao billing do Lakebase; cobre o projeto inteiro
      # (todo branch/endpoint). Ver resource_tags_list em variables.
      custom_tags: ${var.resource_tags_list}
      default_endpoint_settings:
        autoscaling_limit_min_cu: 0.5
        autoscaling_limit_max_cu: 16
        suspend_timeout_duration: ${var.lakebase_suspend_timeout}

  postgres_endpoints:
    ai_prism_pg_rw:
      endpoint_id: primary
      # branch path of the auto-created default branch on the project above
      parent: projects/${resources.postgres_projects.ai_prism_pg.project_id}/branches/production
      endpoint_type: ENDPOINT_TYPE_READ_WRITE
      # adopt the endpoint the project auto-created instead of erroring on "already exists"
      replace_existing: true
      autoscaling_limit_min_cu: 0.5
      autoscaling_limit_max_cu: 16
      suspend_timeout_duration: ${var.lakebase_suspend_timeout}

  # --- Serverless SQL Warehouse: UC Function tools + built-in Python UDF ---
  sql_warehouses:
    ai_prism_wh:
      name: ai-prism
      cluster_size: 2X-Small
      # PRO é o tipo exigido para serverless; com warehouse_serverless=false
      # (workspace sem serverless) vira Pro clássico.
      warehouse_type: PRO
      enable_serverless_compute: ${var.warehouse_serverless}
      enable_photon: true
      auto_stop_mins: 10
      max_num_clusters: 1
      # custom_tags (não "tags: {...}" direto): o campo tags do warehouse é um
      # objeto que embrulha custom_tags: [{key,value}] (sql.EndpointTags).
      tags:
        custom_tags: ${var.resource_tags_list}

  # --- AI/BI dashboards over system tables (see dashboards/README.md) ---
  # The auto-config job publishes the cost dashboard; the operations dashboard
  # lands as a draft until someone publishes it (dashboards/README.md, Publish).
  dashboards:
    ai_prism_costs:
      display_name: "AI Prism — AI costs per user"
      file_path: ./dashboards/ai-costs.lvdash.json
      warehouse_id: ${resources.sql_warehouses.ai_prism_wh.id}
    ai_prism_ops:
      display_name: "AI Prism — Operations"
      file_path: ./dashboards/ai-ops.lvdash.json
      warehouse_id: ${resources.sql_warehouses.ai_prism_wh.id}

    ai_prism_telemetry:
      display_name: "AI Prism — Telemetry"
      file_path: ./dashboards/ai-telemetry.lvdash.json
      warehouse_id: ${resources.sql_warehouses.ai_prism_wh.id}

  # --- SQL alerts over the telemetry tables (docs/operations.md §5.2). Created paused. ---
  alerts:
    ai_prism_a2_http_errors:
      display_name: "AI Prism A2 — more than 5% of API responses failed (10 min)"
      custom_summary: "AI Prism: {{QUERY_RESULT_VALUE}}% of /api responses failed in the last 10 minutes"
      custom_description: >-
        5xx, 302 or 401 on /api/* above 5% (at least 5 requests) in 10 minutes. The result row carries
        last_failing_trace_id. Open the telemetry dashboard (Dashboards, "AI Prism — Telemetry", id ${resources.dashboards.ai_prism_telemetry.id}),
        page "Falhas e trace", pick that trace id. Runbook: docs/operations.md section 5.2.
      query_text: >-
        SELECT COUNT(*) AS requests,
        SUM(CASE WHEN status >= 500 OR status IN (302, 401) THEN 1 ELSE 0 END) AS failed,
        CASE WHEN COUNT(*) >= 5 THEN round(100.0 * SUM(CASE WHEN status >= 500 OR status IN (302, 401) THEN 1 ELSE 0 END) / COUNT(*), 1) ELSE 0.0 END AS error_pct,
        max_by(trace_id, CASE WHEN status >= 500 OR status IN (302, 401) THEN time END) AS last_failing_trace_id
        FROM (SELECT time, trace_id, attributes:['http.status_code']::int AS status
        FROM ${var.telemetry_catalog}.${var.telemetry_schema}.otel_spans
        WHERE kind = 'SPAN_KIND_SERVER' AND name LIKE '% /api/%'
        AND time >= current_timestamp() - INTERVAL 10 MINUTES)
      warehouse_id: ${resources.sql_warehouses.ai_prism_wh.id}
      evaluation:
        source:
          name: error_pct
        comparison_operator: GREATER_THAN
        threshold:
          value:
            double_value: 5
        empty_result_state: OK
        notification:
          notify_on_ok: false
          retrigger_seconds: 600
      schedule:
        quartz_cron_schedule: "0 0/5 * * * ?"
        timezone_id: UTC
        pause_status: ${var.telemetry_alerts_pause}

    ai_prism_a7_turn_errors:
      display_name: "AI Prism A7 — more than 10% of chat turns ended in error (30 min)"
      custom_summary: "AI Prism: {{QUERY_RESULT_VALUE}}% of chat turns failed in the last 30 minutes"
      custom_description: >-
        chat.turn spans with status=error above 10% (at least 5 turns) in 30 minutes (SLO S4).
        Open the telemetry dashboard (Dashboards, "AI Prism — Telemetry", id ${resources.dashboards.ai_prism_telemetry.id}), page "Falhas e trace".
      query_text: >-
        SELECT COUNT(*) AS turns,
        SUM(CASE WHEN attributes:['status']::string = 'error' THEN 1 ELSE 0 END) AS failed,
        CASE WHEN COUNT(*) >= 5 THEN round(100.0 * SUM(CASE WHEN attributes:['status']::string = 'error' THEN 1 ELSE 0 END) / COUNT(*), 1) ELSE 0.0 END AS error_pct,
        max_by(trace_id, CASE WHEN attributes:['status']::string = 'error' THEN time END) AS last_failing_trace_id
        FROM ${var.telemetry_catalog}.${var.telemetry_schema}.otel_spans
        WHERE name = 'chat.turn' AND time >= current_timestamp() - INTERVAL 30 MINUTES
      warehouse_id: ${resources.sql_warehouses.ai_prism_wh.id}
      evaluation:
        source:
          name: error_pct
        comparison_operator: GREATER_THAN
        threshold:
          value:
            double_value: 10
        empty_result_state: OK
        notification:
          notify_on_ok: false
          retrigger_seconds: 1800
      schedule:
        quartz_cron_schedule: "0 0/10 * * * ?"
        timezone_id: UTC
        pause_status: ${var.telemetry_alerts_pause}

  # --- Post-deploy auto-config: provisions the Python UDF, surfaces config ---
  jobs:
    ai_prism_auto_config:
      name: ai-prism-auto-config
      tags: ${var.resource_tags}
      usage_policy_id: ${var.serverless_usage_policy_id}
      # psycopg2-binary fixado e pré-instalado por um Environment do job (não um
      # `pip install` em runtime: um psycopg2 instalado em runtime deu SIGABRT
      # ao importar em algumas execuções). Só vale para a task deste job (serverless);
      # o caminho de cluster clássico de deploy.sh/deploy.ps1 (jobs submit) não
      # copia environment_key e mantém a instalação em runtime com a mesma versão
      # (ver bundle/auto_config.py).
      environments:
        - environment_key: lakebase_deps
          spec:
            environment_version: "5"
            dependencies:
              - psycopg2-binary==2.9.10
      tasks:
        - task_key: auto_config
          environment_key: lakebase_deps
          notebook_task:
            notebook_path: ./bundle/auto_config.py
            base_parameters:
              # JSON (resource_tags_json, não resource_tags): um parâmetro de
              # notebook é sempre string.
              resource_tags_json: ${var.resource_tags_json}
              catalog: ${var.tools_catalog}
              schema: ${var.tools_schema}
              warehouse_id: ${resources.sql_warehouses.ai_prism_wh.id}
              lakebase_host: ${resources.postgres_endpoints.ai_prism_pg_rw.status.hosts.host}
              lakebase_db: ${var.lakebase_database}
              lakebase_port: "5432"
              # endpoint path for the Lakebase credentials API (mints a PG JWT so
              # the deploy job can create the app SP's Postgres role)
              lakebase_endpoint: projects/${resources.postgres_projects.ai_prism_pg.project_id}/branches/production/endpoints/primary
              app_name: ai-prism
              # The bundle deploys the cost dashboard as a draft; the job publishes
              # it so admins see it live right after deploy.
              dashboard_id: ${resources.dashboards.ai_prism_costs.id}
              # Dedicated image store — the job creates the catalog/schema/volume
              # and grants the app service principal READ/WRITE VOLUME on it.
              image_volume_catalog: ${var.image_volume_catalog}
              image_volume_schema: ${var.image_volume_schema}
              image_volume_name: ${var.image_volume_name}
              app_sp_client_id: ${resources.apps.ai_prism.service_principal_client_id}

  # --- The app itself: env wired from the resources above ---
  apps:
    ai_prism:
      name: ai-prism
      description: "AI Prism — your own multi-model chat on the Databricks AI Gateway."
      source_code_path: ./
      # [Public Preview] serverless usage policy já existente (opcional) — ver a
      # variável serverless_usage_policy_id. Apps não tem campo `tags` direto
      # (só budget_policy_id/usage_policy_id): o consumo serverless do App só
      # pode ser marcado por esta policy.
      usage_policy_id: ${var.serverless_usage_policy_id}
      # On-behalf-of-user (OBO) OAuth scopes the app requests when calling
      # Databricks APIs as the signed-in user. These MUST be declared here on the
      # bundle resource — the scopes in app.yaml (user_authorization.scopes) are
      # NOT applied by `bundle deploy`, so without this the app only gets the
      # auto-granted iam.* scopes and every AI Gateway call fails with
      # "External authorization failed". (iam.current-user:read /
      # iam.access-control:read are auto-granted — do not list them.)
      user_api_scopes:
        - serving.serving-endpoints   # AI Gateway: /serving-endpoints/chat/completions + embeddings
        - sql                         # Statement Execution: UC Function discovery/exec + Python UDF
        - dashboards.genie            # Genie spaces (list/metadata)
        - genie                       # Genie One MCP (query). The Genie One endpoint rejects
                                      #   `dashboards.genie` with 403 "OAuth token does not have
                                      #   required scopes: genie" — it needs the SHORT `genie`
                                      #   scope. Both are listed: dashboards.genie for the spaces
                                      #   API, genie for the conversational MCP.
        - vectorsearch.vector-search-endpoints
        - vectorsearch.vector-search-indexes
        # MCP Service discovery is NOT a Unity Catalog scan. The list API
        # (GET /api/2.1/unity-catalog/mcp-services) needs the `unity-catalog`
        # token scope, which Apps cannot grant OBO (confirmed live: the forwarded
        # token carries the literal declarable scopes, never `unity-catalog`; and
        # `unity-catalog[:read]`/`catalog` are rejected by the Apps scope
        # validator). Discovery instead surfaces the curated managed `system.ai.*`
        # set + whatever an admin publishes in the "Catálogo MCP" tab (validated
        # OBO with the admin's token; workspace suggestions come from the app SP's
        # own all-apis token, not OBO) + connect-by-name, all invoked/validated
        # OBO through the Unity AI Gateway — so only `ai-gateway` is needed for MCP. The catalog.*
        # scopes below are VESTIGIAL now (kept to avoid a re-consent churn; safe
        # to trim later).
        - catalog.catalogs
        - catalog.schemas
        - catalog.tables
        - ai-gateway                  # INVOKE + validate MCP Services via the Unity AI Gateway
                                      #   (/ai-gateway/mcp-services/<catalog>.<schema>.<service>).
        - mcp.external                # (legado) proxy /api/2.0/mcp/external/<connection>
        - files.files                 # UC Volume read/write for generated images (Files API)
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${resources.sql_warehouses.ai_prism_wh.id}
            permission: CAN_USE
        # Lakebase as an app resource. The Apps runtime injects the endpoint path
        # for value_from: lakebase (see PG_ENDPOINT below) and lets the app SP
        # connect. This is how the app learns its Lakebase per workspace WITHOUT a
        # hardcoded host — a nested ${...status.hosts.host} does NOT resolve into
        # app config, which is why an earlier hardcoded PGHOST silently pointed the
        # app at the wrong cloud's Lakebase (SQLSTATE 28000).
        - name: lakebase
          postgres:
            branch: projects/${resources.postgres_projects.ai_prism_pg.project_id}/branches/production
            # NOTE: the database_id in this PATH is the UC resource id, which the
            # platform derives from the PG db name by replacing '_' with '-' — so
            # the default "databricks_postgres" DB has id "databricks-postgres".
            # The actual PG connection still uses PGDATABASE=databricks_postgres.
            database: projects/${resources.postgres_projects.ai_prism_pg.project_id}/branches/production/databases/databricks-postgres
            permission: CAN_CONNECT_AND_CREATE
      # IMPORTANT: the app's runtime ENV comes from `app.yaml` (+ the resource
      # injections declared above: `lakebase` → PGHOST/PG_ENDPOINT,
      # `sql-warehouse` → SQL_WAREHOUSE_ID) — NOT from a `config.env` block here.
      # A `config.env` set at this level did NOT reach the running app in testing
      # (values came back undefined), so all env lives in app.yaml. The bootstrap
      # admin (deployer) is seeded into the app_admins table by the auto-config
      # job (see bundle/auto_config.py), since it can't be a static app.yaml value.
      # We still set `command` here to pin the entrypoint.
      config:
        command: ["node", "server-dist/index.cjs"]

# Cloud-agnostic: no host is hardcoded here. The workspace comes from the CLI
# profile you deploy with (`-p <PROFILE>`), so the SAME bundle deploys to any
# workspace on any cloud (AWS / Azure / GCP) without editing this file:
#
#   databricks bundle deploy -p <PROFILE> -t dev
#
# `-p` selects the profile from ~/.databrickscfg; its `host` is the workspace.
targets:
  dev:
    mode: development
    default: true

  prod:
    mode: production

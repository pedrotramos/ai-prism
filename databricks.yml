# AI Prism — Databricks Asset Bundle.
#
# One `databricks bundle deploy` provisions the ENTIRE stack for a fresh
# workspace, so an operator needs zero manual infra steps:
#
#   • Lakebase (serverless Postgres) — autoscaling 0.5–16 CU, auto-stops after
#     30 min idle. Stores chat sessions/messages, deck templates and pgvector RAG.
#   • Serverless SQL Warehouse — runs UC Function tools and the built-in Python UDF.
#   • The Databricks App itself — env wired from the resources above (no hand-edited
#     app.yaml): the deploying user becomes the bootstrap admin.
#   • The AI/BI cost dashboard (system-tables auditing).
#   • A post-deploy auto-config job — provisions the built-in Python UDF and prints
#     the resolved config (deployer email, warehouse id, Lakebase host/db).
#
# Everything is scoped per workspace: each customer deploys their own copy. The
# app still runs the prebuilt artifacts (client/dist + server-dist), so run
# `npm run bundle` before deploying.
bundle:
  name: ai-prism

variables:
  tools_catalog:
    description: >-
      Catalog where the built-in Python UDF is provisioned. Defaults to the
      dedicated `ai_prism` catalog so all AI Prism assets (UDF + image volume)
      live in one place.
    default: ai_prism
  tools_schema:
    description: Schema where the built-in Python UDF is provisioned.
    default: default
  lakebase_database:
    description: Lakebase (Postgres) database name.
    default: databricks_postgres
  image_volume_catalog:
    description: >-
      Catalog for AI Prism's generated-image storage. Defaults to the dedicated
      `ai_prism` catalog (same as the tools catalog) so all AI Prism assets live
      in one place; the app owner can point it anywhere.
    default: ai_prism
  image_volume_schema:
    description: Schema (inside image_volume_catalog) for the images volume.
    default: default
  image_volume_name:
    description: UC Volume name that holds the generated-image bytes.
    default: ai_prism_images

resources:
  # --- Lakebase: serverless Postgres, autoscaling 0.5–16 CU, 30-min auto-stop ---
  # Lakebase has TWO product lines with different APIs:
  #   • "Autoscaling" (projects/branches/endpoints, /api/2.0/postgres/...) —
  #     the ONLY one with an autoscaling CU range + scale-to-zero. Cloud-agnostic.
  #   • "Provisioned" (database_instances) — fixed capacity SKU only, no autoscale.
  # We use Autoscaling so the compute range + auto-stop below are honored.
  #
  # Creating the project auto-provisions a default branch ("production") and a
  # read-write endpoint ("primary") with these default_endpoint_settings applied.
  # The endpoint host is not exposed on the project, so we declare the primary
  # endpoint explicitly and adopt the auto-created one via replace_existing, with
  # its parent = the branch path (NOT the project — that path 404s). We then read
  # the resolved read-write host from status.hosts.host.
  postgres_projects:
    ai_prism_pg:
      project_id: ai-prism
      display_name: ai-prism
      default_endpoint_settings:
        autoscaling_limit_min_cu: 0.5
        autoscaling_limit_max_cu: 16
        suspend_timeout_duration: 1800s

  postgres_endpoints:
    ai_prism_pg_rw:
      endpoint_id: primary
      # branch path of the auto-created default branch on the project above
      parent: projects/${resources.postgres_projects.ai_prism_pg.project_id}/branches/production
      endpoint_type: ENDPOINT_TYPE_READ_WRITE
      # adopt the endpoint the project auto-created instead of erroring on "already exists"
      replace_existing: true
      autoscaling_limit_min_cu: 0.5
      autoscaling_limit_max_cu: 16
      suspend_timeout_duration: 1800s

  # --- Serverless SQL Warehouse: UC Function tools + built-in Python UDF ---
  sql_warehouses:
    ai_prism_wh:
      name: ai-prism
      cluster_size: 2X-Small
      enable_serverless_compute: true
      enable_photon: true
      auto_stop_mins: 10
      max_num_clusters: 1

  # --- AI/BI cost dashboard (system-tables auditing) ---
  dashboards:
    ai_prism_costs:
      display_name: "AI Prism — AI costs per user"
      file_path: ./dashboards/ai-costs.lvdash.json
      warehouse_id: ${resources.sql_warehouses.ai_prism_wh.id}

  # --- Post-deploy auto-config: provisions the Python UDF, surfaces config ---
  jobs:
    ai_prism_auto_config:
      name: ai-prism-auto-config
      tasks:
        - task_key: auto_config
          notebook_task:
            notebook_path: ./bundle/auto_config.py
            base_parameters:
              catalog: ${var.tools_catalog}
              schema: ${var.tools_schema}
              warehouse_id: ${resources.sql_warehouses.ai_prism_wh.id}
              lakebase_host: ${resources.postgres_endpoints.ai_prism_pg_rw.status.hosts.host}
              lakebase_db: ${var.lakebase_database}
              lakebase_port: "5432"
              # endpoint path for the Lakebase credentials API (mints a PG JWT so
              # the deploy job can create the app SP's Postgres role)
              lakebase_endpoint: projects/${resources.postgres_projects.ai_prism_pg.project_id}/branches/production/endpoints/primary
              app_name: ai-prism
              # The bundle deploys the cost dashboard as a draft; the job publishes
              # it so admins see it live right after deploy.
              dashboard_id: ${resources.dashboards.ai_prism_costs.id}
              # Dedicated image store — the job creates the catalog/schema/volume
              # and grants the app service principal READ/WRITE VOLUME on it.
              image_volume_catalog: ${var.image_volume_catalog}
              image_volume_schema: ${var.image_volume_schema}
              image_volume_name: ${var.image_volume_name}
              app_sp_client_id: ${resources.apps.ai_prism.service_principal_client_id}

  # --- The app itself: env wired from the resources above ---
  apps:
    ai_prism:
      name: ai-prism
      description: "AI Prism — your own multi-model chat on the Databricks AI Gateway."
      source_code_path: ./
      # On-behalf-of-user (OBO) OAuth scopes the app requests when calling
      # Databricks APIs as the signed-in user. These MUST be declared here on the
      # bundle resource — the scopes in app.yaml (user_authorization.scopes) are
      # NOT applied by `bundle deploy`, so without this the app only gets the
      # auto-granted iam.* scopes and every AI Gateway call fails with
      # "External authorization failed". (iam.current-user:read /
      # iam.access-control:read are auto-granted — do not list them.)
      user_api_scopes:
        - serving.serving-endpoints   # AI Gateway: /serving-endpoints/chat/completions + embeddings
        - sql                         # Statement Execution: UC Function discovery/exec + Python UDF
        - dashboards.genie            # Genie spaces (list/metadata)
        - genie                       # Genie One MCP (query). The Genie One endpoint rejects
                                      #   `dashboards.genie` with 403 "OAuth token does not have
                                      #   required scopes: genie" — it needs the SHORT `genie`
                                      #   scope. Both are listed: dashboards.genie for the spaces
                                      #   API, genie for the conversational MCP.
        - vectorsearch.vector-search-endpoints
        - vectorsearch.vector-search-indexes
        # MCP Service discovery is NOT a Unity Catalog scan. The list API
        # (GET /api/2.1/unity-catalog/mcp-services) needs the `unity-catalog`
        # token scope, which Apps cannot grant OBO (confirmed live: the forwarded
        # token carries the literal declarable scopes, never `unity-catalog`; and
        # `unity-catalog[:read]`/`catalog` are rejected by the Apps scope
        # validator). Discovery instead surfaces the curated managed `system.ai.*`
        # set + connect-by-name, all invoked/validated OBO through the Unity AI
        # Gateway — so only `ai-gateway` is actually needed for MCP. The catalog.*
        # scopes below are VESTIGIAL now (kept to avoid a re-consent churn; safe
        # to trim later).
        - catalog.catalogs
        - catalog.schemas
        - catalog.tables
        - ai-gateway                  # INVOKE + validate MCP Services via the Unity AI Gateway
                                      #   (/ai-gateway/mcp-services/<catalog>.<schema>.<service>).
        - mcp.external                # (legado) proxy /api/2.0/mcp/external/<connection>
        - files.files                 # UC Volume read/write for generated images (Files API)
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${resources.sql_warehouses.ai_prism_wh.id}
            permission: CAN_USE
        # Lakebase as an app resource. The Apps runtime injects the endpoint path
        # for value_from: lakebase (see PG_ENDPOINT below) and lets the app SP
        # connect. This is how the app learns its Lakebase per workspace WITHOUT a
        # hardcoded host — a nested ${...status.hosts.host} does NOT resolve into
        # app config, which is why an earlier hardcoded PGHOST silently pointed the
        # app at the wrong cloud's Lakebase (SQLSTATE 28000).
        - name: lakebase
          postgres:
            branch: projects/${resources.postgres_projects.ai_prism_pg.project_id}/branches/production
            # NOTE: the database_id in this PATH is the UC resource id, which the
            # platform derives from the PG db name by replacing '_' with '-' — so
            # the default "databricks_postgres" DB has id "databricks-postgres".
            # The actual PG connection still uses PGDATABASE=databricks_postgres.
            database: projects/${resources.postgres_projects.ai_prism_pg.project_id}/branches/production/databases/databricks-postgres
            permission: CAN_CONNECT_AND_CREATE
      # IMPORTANT: the app's runtime ENV comes from `app.yaml` (+ the resource
      # injections declared above: `lakebase` → PGHOST/PG_ENDPOINT,
      # `sql-warehouse` → SQL_WAREHOUSE_ID) — NOT from a `config.env` block here.
      # A `config.env` set at this level did NOT reach the running app in testing
      # (values came back undefined), so all env lives in app.yaml. The bootstrap
      # admin (deployer) is seeded into the app_admins table by the auto-config
      # job (see bundle/auto_config.py), since it can't be a static app.yaml value.
      # We still set `command` here to pin the entrypoint.
      config:
        command: ["node", "server-dist/index.cjs"]

# Cloud-agnostic: no host is hardcoded here. The workspace comes from the CLI
# profile you deploy with (`-p <PROFILE>`), so the SAME bundle deploys to any
# workspace on any cloud (AWS / Azure / GCP) without editing this file:
#
#   databricks bundle deploy -p <PROFILE> -t dev
#
# `-p` selects the profile from ~/.databrickscfg; its `host` is the workspace.
targets:
  dev:
    mode: development
    default: true

  prod:
    mode: production

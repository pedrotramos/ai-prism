command:
  - "node"
  - "server-dist/index.cjs"

# Minimum scopes for every API the server calls on behalf of the user:
# model-serving (AI Gateway), genie (spaces list + Genie One MCP),
# sql (Statement Execution: UC Function discovery/exec + built-in Python tool),
# vector-search (endpoints/indexes/query), catalog.connections + mcp.external
# (external MCP connections). UC Functions run via SQL, not the managed
# functions MCP, so mcp.functions is not needed.
user_authorization:
  scopes:
    - model-serving
    - genie
    - sql
    - vector-search
    - catalog.connections
    - mcp.external
    # files: read/write the UC Volume that stores generated images (Files API,
    # on-behalf-of the user) — see server/imageStore.js
    - files

# IMPORTANT: never hardcode workspace-specific infra here (Lakebase host, warehouse
# id, catalogs). The Apps runtime reads env from this file, so a hardcoded host
# would point the app at the WRONG (e.g. another cloud's) Lakebase and fail every
# DB call with SQLSTATE 28000 "External authorization failed".
#
# The Lakebase connection is delivered via an APP RESOURCE (key: `lakebase`,
# declared in databricks.yml). `valueFrom: lakebase` injects that resource's
# endpoint PATH at runtime, and the resource also auto-injects PGHOST; the app
# resolves the real host + a connection JWT at boot (lakebaseHost() in
# server/db.js). SQL_WAREHOUSE_ID comes from the `sql-warehouse` resource the
# same way. The bundle's databricks.yml config.env does NOT reach the running app
# (verified), so ALL env lives HERE. For LOCAL dev (bare `npm start`, no bundle),
# export PGHOST + SQL_WAREHOUSE_ID in your shell.
env:
  - name: NODE_ENV
    value: 'production'
  # Boot path (docs/adr/0001-appkit.md). server-dist/index.cjs is a launcher:
  # APPKIT_BOOT unset (the default, on purpose) boots Databricks AppKit
  # (server-dist/appkit.mjs: /health, AppKit's server plugin, our Express routes
  # mounted inside it). To roll back to the legacy Express listener
  # (server-dist/legacy.cjs), uncomment the two lines below and redeploy the SAME
  # build (no rebuild needed). Never set '1' here: it is the internal "embedded, do
  # not listen" signal, and a pre-launcher server-dist/index.cjs would never listen
  # (tests/appkit-boot.test.mjs enforces this).
  # - name: APPKIT_BOOT
  #   value: '0'
  - name: DATABRICKS_APP_NAME
    value: 'ai-prism'
  - name: PORT
    value: '8000'
  - name: PGPORT
    value: '5432'
  # Time zone (IANA) where the taxímetro's billing month rolls over, e.g.
  # America/Sao_Paulo. Empty/invalid → UTC.
  - name: USAGE_TIMEZONE
    value: ''
  - name: PGSSLMODE
    value: 'require'
  - name: PGDATABASE
    value: 'databricks_postgres'
  # Lakebase endpoint path, injected from the `lakebase` app resource. The app
  # resolves host + connection token from it at boot (server/db.js lakebaseHost()).
  # (The `lakebase` resource also auto-injects PGHOST directly.)
  - name: PG_ENDPOINT
    valueFrom: 'lakebase'
  # SQL warehouse id, injected from the `sql-warehouse` app resource (declared in
  # databricks.yml). The app runtime reads env from THIS file plus resource
  # injections — the bundle's databricks.yml config.env does NOT reach the running
  # app — so warehouse/PG must arrive via app.yaml + resources, never config.env.
  - name: SQL_WAREHOUSE_ID
    valueFrom: 'sql-warehouse'
  # Tools UDF + image-store locations. Everything AI Prism owns lives in the
  # dedicated `ai_prism` catalog (built-in Python UDF and the image volume), so
  # it's all in one place. The app falls back to these same defaults in code.
  - name: TOOLS_CATALOG
    value: 'ai_prism'
  - name: TOOLS_SCHEMA
    value: 'default'
  - name: IMAGE_VOLUME_CATALOG
    value: 'ai_prism'
  - name: IMAGE_VOLUME_SCHEMA
    value: 'default'
  - name: IMAGE_VOLUME_NAME
    value: 'ai_prism_images'
  # Tags de recurso (JSON), gravado pelo deploy (deploy.sh / deploy.ps1 / o
  # notebook instalador) a partir de --tag/TAGS, sempre com a tag embutida
  # ai_prism_app. Lido em runtime por server/resourceTags.js (usage_context do AI
  # Gateway e query_tags do SQL Warehouse) — ver docs/tags.md. Sem deploy por
  # wrapper, fica o padrão abaixo (só a tag embutida).
  - name: AI_PRISM_RESOURCE_TAGS
    value: '{"ai_prism_app": "ai-prism"}'
  # Admin audit hash key (W2-17, docs/security-threat-model.md G8). With it, the
  # admin_audit actor (and user target) is 'h2:' + HMAC-SHA256 of the lowercased
  # e-mail, so the trail cannot be reversed by a dictionary of e-mails. Without
  # it the app falls back to the legacy unsalted hash and logs ONE warning at
  # boot. The key comes from the `audit-hash-key` secret resource
  # (bundle/optional/audit-hash-key-secret.yml.example), never as a literal
  # here. Keep the same key across deploys: a new key changes every new hash.
  # - name: APP_AUDIT_HASH_KEY
  #   valueFrom: 'audit-hash-key'
  # Audio/video understanding (server/transcribe.js). Media attachments are read
  # by a MULTIMODAL LLM — Gemini via the gateway's `audio_url`/`video_url`
  # content parts — which transcribes audio and understands video (speech +
  # on-screen), then flows into the normal attachment pipeline so the user's own
  # model does the task (summary, action items, …). NOTE: only Gemini ingests
  # audio/video on the Databricks gateway (Claude/GPT reject it), so this hop
  # always uses a Gemini model regardless of the user's chat model. Override
  # with TRANSCRIBE_MODEL (must accept audio/video); default is
  # databricks-gemini-3-5-flash. Long recordings (1h+) are segmented in the
  # browser into sub-cap chunks before upload. Set TRANSCRIBE_DISABLED=1 to
  # hard-disable (hides the media picker).
  - name: TRANSCRIBE_MODEL
    value: 'databricks-gemini-3-5-flash'
  # Web search (docs/web-search.md, ADR 0007). MCP-first chain under the default
  # WEB_SEARCH_BACKEND=auto: (1) the managed MCP system.ai.web_search where the
  # workspace has it (no setting needed), (2) the external MCP Service named in
  # WEB_SEARCH_MCP_SERVICE (registered in Unity Gateway, restricted to its search
  # tool, EXECUTE granted to the app's users; the provider key stays in its UC
  # connection), (3) keyed APIs (Brave, Tavily) and a self-hosted SearXNG.
  # Nothing configured on a workspace without the managed MCP = no web tools.
  # WEB_SEARCH_DISABLED=1 turns web_search + web_fetch off and wins over all.
  # - name: WEB_SEARCH_DISABLED
  #   value: '1'
  # - name: WEB_SEARCH_BACKEND          # auto | off | one backend | ordered list
  #   value: 'auto'                     #   e.g. 'external-mcp,brave'
  # - name: WEB_SEARCH_MCP_SERVICE      # <catalog>.<schema>.<service>
  #   value: 'my_catalog.my_schema.firecrawl_search'
  # - name: WEB_SEARCH_MCP_TOOL         # only when the tool name is not a known one
  #   value: 'firecrawl_search'
  # Keyed fallback: the key comes from the `web-search-key` secret resource
  # (bundle/optional/web-search-secret.yml.example), never as a literal here.
  # - name: BRAVE_SEARCH_API_KEY
  #   valueFrom: 'web-search-key'
  # - name: TAVILY_API_KEY
  #   valueFrom: 'web-search-key'
  # - name: SEARXNG_URL                 # your instance, JSON format enabled
  #   value: 'https://search.example.com'
  # - name: WEB_SEARCH_PRICE_PER_1K_USD # price for every provider (beats the Brave/Tavily seeds; an admin override beats it)
  #   value: ''

  # Scheduled agents (ADR-0018). OFF unless AGENTS_ENABLED is '1'; an admin must also turn the feature on in Settings.
  # Without the env var the scheduler does not start: no timer, no database read.
  # - name: AGENTS_ENABLED
  #   value: '1'
  # - name: AGENTS_MAX_CONCURRENT_RUNS      # runs at once in this process (default 2, never above the fixed 4 across all processes)
  #   value: '2'
  # - name: AGENT_RUN_TIMEOUT_MS            # one run's limit (1 s-1 h, default 600000)
  #   value: '600000'
  # - name: AGENT_SCHEDULER_MAX_SLEEP_MS    # the longest the scheduler sleeps between checks (default 900000)
  #   value: '900000'

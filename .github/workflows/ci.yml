name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # labeled/unlabeled: adding the "release" (dist check) or "skip-changelog"
    # label re-runs the checks that depend on it
    types: [opened, synchronize, reopened, labeled, unlabeled]

# Least privilege: o GITHUB_TOKEN só lê o repositório. Nenhum job publica nada.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-qa:
    name: Build & QA
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Postgres with pgvector for the isolation and route suites
    # (server/isolation.test.js, tests/routes.test.mjs) and for the smoke.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ai_prism
          POSTGRES_PASSWORD: ai_prism
          POSTGRES_DB: ai_prism
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U ai_prism"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        # Usa o registry público (registry-url acima): fora da VPN da Databricks o
        # proxy interno (npm-proxy.cloud.databricks.com) é inalcançável e o `npm ci`
        # pendura em silêncio. As URLs do package-lock.json apontam para o registry
        # público; localmente, o `~/.npmrc` + replace-registry-host as reescrevem
        # transparentemente para o proxy interno.
        # --include=dev: o .npmrc do repo tem omit=dev (o app deployado roda
        # pré-compilado), mas TODO o toolchain vive em devDependencies.
        # --ignore-scripts: pula o postinstall do esbuild (baixa binário da rede); o
        # binário já vem do pacote optional @esbuild/linux-x64 no lockfile.
        run: npm ci --include=dev --ignore-scripts

      - name: Docs translations (G-docs)
        # scripts/check-docs-i18n.mjs (tested by scripts/check-docs-i18n.test.mjs)
        # against docs/i18n.json: every English page has its pt-BR and es
        # translation (or is listed in allowMissing), a translation stamped
        # current matches the English blob, headings/tables/code blocks and the
        # language switcher line up, relative links and anchors resolve, no page
        # advertises a Node.js older than engines, and no prohibited name appears
        # anywhere. Hash based, so the shallow checkout is enough. No pipe and no
        # `|| true`: the checker's exit code is the step's exit code.
        run: node scripts/check-docs-i18n.mjs --ci

      - name: Postgres roles fixture (W2-1, row-level security)
        # The service user above is a SUPERUSER, which skips row-level security: a
        # suite running db.js as it would prove nothing about the policies.
        # scripts/ci/pg-roles.sql creates ai_prism_app (LOGIN, no SUPERUSER, no
        # BYPASSRLS, owns nothing), the shape of the app's service principal on
        # Lakebase; server/isolation.test.js runs db.js as that role. Idempotent.
        # The password is the service's throwaway one (see services.postgres).
        env:
          PGPASSWORD: ai_prism
        run: |
          psql -h 127.0.0.1 -p 55432 -U ai_prism -d ai_prism -v ON_ERROR_STOP=1 -f scripts/ci/pg-roles.sql
          psql -h 127.0.0.1 -p 55432 -U ai_prism -d ai_prism -v ON_ERROR_STOP=1 -tAc \
            "SELECT rolname, rolsuper, rolbypassrls FROM pg_roles WHERE rolname = 'ai_prism_app'"

      - name: Unit tests (G-unit, G-iso)
        # tests/run.mjs discovers every *.test.js / *.test.mjs / *.test.ts / *.test.mts
        # under server, shared, scripts, tests and client/src and passes them to
        # node --test as an explicit list (an empty list would make node fall back to
        # its default glob and run scripts/load-test.mjs). .test.ts runs natively
        # (Node >= 22.18 strips the types); tests/runner.test.mjs fails the job if a
        # tracked *.test.* file is not in that list, so none can silently never run.
        # --fail-on-skip: the suites that need Postgres
        # (isolation, rls, routes) must run here, against the service above.
        # --expect: the two-user isolation suite (as the non-owner app role, under
        # FORCE ROW LEVEL SECURITY) must pass all 19 cases, the RLS suite all 30.
        run: node tests/run.mjs --fail-on-skip --expect server/isolation.test.js=19 --expect server/rls.test.js=30

      - name: QA (checagens offline de deck/planilha/documento)
        run: npm run qa

      - name: Dist drift mode (release PRs only)
        # Feature PRs do NOT commit client/dist or server-dist (hashed file names
        # make any two client PRs conflict there). Release PRs (branch release/* or
        # label "release") rebuild and commit them, and only they are checked.
        # The decision lives in tests/ci/dist-drift-mode.sh (tested by
        # tests/distDriftMode.test.mjs); inputs go through env, never inline.
        id: dist
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          mode="$(bash tests/ci/dist-drift-mode.sh)"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "dist drift check: $mode"

      - name: Build (client + server)
        # Always runs: the build must pass on every PR, release or not.
        run: npm run bundle

      - name: Boot (G-boot) — server-dist/index.cjs against a mock workspace
        # The artifacts `npm run bundle` just wrote, run the way the Apps runtime runs
        # them (copied away from node_modules, cwd = app root): the launcher boots
        # AppKit by default (/health JSON, SPA, /api/me 401, 2 MB JSON POST not 413,
        # SCIM /Me against a mock workspace) and the legacy listener with
        # APPKIT_BOOT=0; EVERY file under server-dist <= 9.5 MB (Databricks Apps
        # rejects a deploy with any app file over 10 MB); app.yaml never sets
        # APPKIT_BOOT to '1'. Fails here, not at deploy or in production, when an
        # AppKit upgrade breaks the ESM bundle or the server code outgrows a file
        # (docs/adr/0001-appkit.md).
        env:
          APPKIT_BOOT_DIST: server-dist
        run: node --test tests/appkit-boot.test.mjs

      - name: Dist is rebuilt at release (feature PR)
        if: steps.dist.outputs.mode != 'check'
        run: |
          echo "::notice title=Dist not checked::Feature PR: client/dist and server-dist are rebuilt and committed only in release PRs (branch release/* or label 'release'). Do not commit them here; run 'npm run bundle' before any deploy."

      - name: Artefatos versionados em dia (client/dist e server-dist)
        if: steps.dist.outputs.mode == 'check'
        # Release PRs only (see "Dist drift mode"). The release commits client/dist
        # and server-dist: the deploy runs what is in the repository, with no build
        # in the workspace. If the build produces any difference (or a new file),
        # the release commit is behind the code.
        run: |
          set -u
          status="$(git status --porcelain -- client/dist server-dist)"
          if [ -n "$status" ]; then
            echo "::error title=Artefatos desatualizados::client/dist ou server-dist não batem com o código."
            echo "Como corrigir (PR de release): rode 'npm run bundle' e commite client/dist e server-dist neste PR."
            echo ""
            echo "Alterações detectadas:"
            echo "$status"
            echo ""
            git --no-pager diff --stat -- client/dist server-dist || true
            exit 1
          fi
          git diff --exit-code -- client/dist server-dist
          echo "✓ client/dist e server-dist estão em dia."

      - name: Smoke (G-smoke) against node server/index.js + fake AI Gateway
        # The real server, the CI Postgres and the fake gateway (scripts/fake-gateway.mjs,
        # shapes pinned to a live recording in tests/fixtures/gateway-shapes.live.json).
        # Same script as the post-deploy smoke (docs/operations.md §5), including the
        # artifact step: the fake answers a document request with a document prism-block.
        env:
          LOCAL_DEV_MODE: '1'
          LOCAL_PGVECTOR: '1'
          HISTORY_RETRIEVAL: 'on'
          DATABRICKS_HOST: http://127.0.0.1:8787
          DATABRICKS_USER_EMAIL: smoke@example.com
          DATABRICKS_USER_TOKEN: fake-token
          PGHOST: 127.0.0.1
          PGPORT: '55432'
          PGUSER: ai_prism
          PGPASSWORD: ai_prism
          PGDATABASE: ai_prism
          PGSSLMODE: disable
          PORT: '8000'
          APP_URL: http://127.0.0.1:8000
          SMOKE_SKIP_ARTIFACT: '0'
          SMOKE_EXPECT_EMAIL: smoke@example.com
          SMOKE_TIMEOUT_MS: '30000'
        run: |
          set -u
          node scripts/fake-gateway.mjs --port 8787 > /tmp/fake-gateway.log 2>&1 &
          node server/index.js > /tmp/server.log 2>&1 &
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:8787/api/2.0/serving-endpoints && curl -fsS -o /dev/null "$APP_URL/api/me"; then
              ready=1; break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::server or fake gateway not ready after 60 s"
            echo "::group::server log"; cat /tmp/server.log; echo "::endgroup::"
            echo "::group::fake gateway log"; cat /tmp/fake-gateway.log; echo "::endgroup::"
            exit 1
          fi
          status=0
          npm run smoke || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::group::server log"; cat /tmp/server.log; echo "::endgroup::"
            echo "::group::fake gateway log"; cat /tmp/fake-gateway.log; echo "::endgroup::"
          fi
          exit "$status"

      - name: npm audit (report-only)
        # Report-only for now: the step never fails the job. --omit=dev is the
        # runtime set, which is EMPTY here (every package is a devDependency because
        # the app ships pre-built bundles), so the second run audits the full tree
        # that goes into client/dist and server-dist.
        continue-on-error: true
        run: |
          npm audit --omit=dev --audit-level=high || true
          npm audit --audit-level=high || true

  typecheck:
    name: Typecheck (tsc --noEmit)
    # tsc --noEmit with `strict` over every .ts under server, shared, client/src and
    # scripts/appkit, test files included (tsconfig.json `include`). The job has no
    # fallback: if the `typecheck` script goes missing the job fails.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev --ignore-scripts

      - name: Typecheck (G-type)
        run: npm run typecheck

  bundle-validate:
    name: databricks bundle validate
    # Só roda com credenciais de workspace nos secrets do repositório. Sem elas
    # (PRs de fork, por exemplo) o job pula com um aviso em vez de falhar.
    # Nenhum host ou profile fica hardcoded: a CLI autentica por variáveis de
    # ambiente (OAuth M2M) e o workspace vem delas.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      BUNDLE_TARGET: ${{ vars.DATABRICKS_BUNDLE_TARGET || 'dev' }}
    steps:
      - uses: actions/checkout@v5

      - name: Verifica se há credenciais
        id: creds
        run: |
          if [ -n "$DATABRICKS_HOST" ] && [ -n "$DATABRICKS_CLIENT_ID" ] && [ -n "$DATABRICKS_CLIENT_SECRET" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Secrets DATABRICKS_HOST / DATABRICKS_CLIENT_ID / DATABRICKS_CLIENT_SECRET ausentes; bundle validate pulado."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Instala a Databricks CLI
        if: steps.creds.outputs.available == 'true'
        uses: databricks/setup-cli@main

      - name: databricks bundle validate
        if: steps.creds.outputs.available == 'true'
        run: databricks bundle validate -t "$BUNDLE_TARGET"

  e2e:
    name: E2E + accessibility (G-e2e)
    # The built client against recorded /api fixtures (client/e2e): user flows,
    # axe on 4 screens x 2 themes x 2 widths, Lighthouse accessibility, touch
    # targets and one-off styles. Fails when any count rises above
    # client/e2e/baseline.json. E2E_STRICT=1 (repository variable) also fails on
    # any serious/critical axe node; it is meant to be turned on once the UX
    # waves have cleared the baseline.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_STRICT: ${{ vars.E2E_STRICT || '0' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev --ignore-scripts

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Build the client
        run: npm run build:client

      - name: Playwright (flows + a11y regression bar)
        run: npm run test:e2e

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: client/e2e/.output/
          include-hidden-files: true # .output/ is a dot folder; v4 skips those by default
          retention-days: 14

  changelog:
    name: Changelog (G-cl)
    runs-on: ubuntu-latest
    # Only on PRs; skippable with the "skip-changelog" label for changes that need no entry.
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: A changelog fragment (or a CHANGELOG.md edit) is present
        # Each PR adds changelog.d/<task-or-branch>.md (see changelog.d/README.md);
        # fragments are folded into CHANGELOG.md at release time by
        # `node scripts/changelog-fragments.mjs release <version>`.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/changelog-fragments.mjs check --base "$BASE_SHA" --head "$HEAD_SHA"

name: Lakebase branch

# Proves the migrations (up, down to 0, up) and the isolation + RLS suites against a REAL
# Lakebase on a throwaway branch (scripts/ci/lakebase-branch.sh). Separate from ci.yml: it
# needs workspace credentials and takes ~15 minutes. Without the secrets below (forks, or a
# repo that did not set them up) it skips with a notice and stays green.
#
# Secrets (repository settings, created by a human; none is read from the workflow):
#   LAKEBASE_CI_HOST           workspace URL
#   LAKEBASE_CI_CLIENT_ID      OAuth client id of a CI service principal that can create and
#                              delete branches of the Lakebase project and is a member of
#                              databricks_superuser there
#   LAKEBASE_CI_CLIENT_SECRET  its secret
# Variable LAKEBASE_CI_PROJECT (optional): project id, default ai-prism.

on:
  pull_request:
    branches: [main]
    paths:
      - server/migrations/**
      - server/db/**
      - server/db.ts
      - server/isolation.test.js
      - server/rls.test.js
      - scripts/migrate.mjs
      - scripts/ci/**
      - .github/workflows/lakebase-branch.yml
  workflow_dispatch:

permissions:
  contents: read

# one run at a time: they share the project's 10-branch limit; never cancel one midway
concurrency:
  group: lakebase-branch
  cancel-in-progress: false

jobs:
  lakebase-branch:
    name: Migrations + isolation on an ephemeral Lakebase branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # no secret here: only the three `run:` steps below get them, in their own `env`
      # (tests/lakebaseBranchScript.test.mjs fails if one appears at job level or on `uses:`)
      LB_PROJECT: ${{ vars.LAKEBASE_CI_PROJECT || 'ai-prism' }}
      LB_SUFFIX: ${{ github.run_id }}-${{ github.run_attempt }}
      LB_EVIDENCE_DIR: ${{ runner.temp }}/lakebase-branch
    steps:
      - name: Credentials present?
        id: creds
        env:
          DATABRICKS_HOST: ${{ secrets.LAKEBASE_CI_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.LAKEBASE_CI_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.LAKEBASE_CI_CLIENT_SECRET }}
        run: |
          if [ -n "$DATABRICKS_HOST" ] && [ -n "$DATABRICKS_CLIENT_ID" ] && [ -n "$DATABRICKS_CLIENT_SECRET" ]; then
            echo "present=1" >> "$GITHUB_OUTPUT"
          else
            echo "present=0" >> "$GITHUB_OUTPUT"
            echo "::notice::Lakebase branch job skipped: the LAKEBASE_CI_* secrets are not set (forks and repos without a CI service principal). Nothing was created."
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: steps.creds.outputs.present == '1'

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: steps.creds.outputs.present == '1'
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        if: steps.creds.outputs.present == '1'
        run: npm ci --include=dev --ignore-scripts

      - uses: databricks/setup-cli@12452ad4003a2dd61d5a7cee30bc068f750a2e00 # v1.27.0
        if: steps.creds.outputs.present == '1'

      - name: Migrations up/down/up and isolation + RLS suites on a throwaway branch
        if: steps.creds.outputs.present == '1'
        env:
          SECRETS_PRESENT: '1'
          DATABRICKS_HOST: ${{ secrets.LAKEBASE_CI_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.LAKEBASE_CI_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.LAKEBASE_CI_CLIENT_SECRET }}
        run: bash scripts/ci/lakebase-branch.sh run

      - name: Sweep this run's branches (even if the job was cancelled or failed)
        # the script's own trap deletes the branch; this is the second net. The branch
        # TTL (4 h) is the third.
        if: always() && steps.creds.outputs.present == '1'
        env:
          DATABRICKS_HOST: ${{ secrets.LAKEBASE_CI_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.LAKEBASE_CI_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.LAKEBASE_CI_CLIENT_SECRET }}
        run: bash scripts/ci/lakebase-branch.sh sweep "${{ github.run_id }}"

      - name: Upload the redacted log
        if: always() && steps.creds.outputs.present == '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lakebase-branch-log
          path: ${{ runner.temp }}/lakebase-branch/lakebase-branch.log
          if-no-files-found: ignore
